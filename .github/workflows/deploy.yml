name: Generate & Deploy Report

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --prefer-binary --timeout 30 --retries 1 psycopg2-binary azure-storage-blob requests openpyxl

      - name: Set up SSH tunnel to bronze PostgreSQL
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.TUNNEL_HOST }}
          PORT: ${{ secrets.TUNNEL_PORT }}
          USER: ${{ secrets.TUNNEL_USER }}
          RDS: ${{ secrets.RDS_HOST }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -f -N -L 5433:${RDS}:5432 \
            -p "$PORT" "$USER@$HOST" \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=60 \
            -o ExitOnForwardFailure=yes
          echo "PostgreSQL bronze tunnel established"

      - name: Generate report
        timeout-minutes: 10
        env:
          CUSTIMOO_DB_HOST: 127.0.0.1
          CUSTIMOO_DB_PORT: 5433
          CUSTIMOO_DB_NAME: custimoo-prod
          CUSTIMOO_DB_USER: lakr@custimoo.com
          CUSTIMOO_DB_SSLMODE: require
          CUSTIMOO_DB_PASSWORD: ${{ secrets.CUSTIMOO_DB_PASSWORD }}
          CUSTIMOO_GRAPH_TENANT_ID: ${{ secrets.CUSTIMOO_GRAPH_TENANT_ID }}
          CUSTIMOO_GRAPH_CLIENT_ID: ${{ secrets.CUSTIMOO_GRAPH_CLIENT_ID }}
          CUSTIMOO_GRAPH_CLIENT_SECRET: ${{ secrets.CUSTIMOO_GRAPH_CLIENT_SECRET }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          FACTORY_SHARE_TOKENS: ${{ secrets.FACTORY_SHARE_TOKENS }}
          QARMA_INSPECTIONS_URL: ${{ secrets.QARMA_INSPECTIONS_URL }}
        run: |
          python3 scripts/html_report.py
          test -s report.html
          python3 - <<'PY'
          import json, re
          s = open('report.html', encoding='utf-8').read()
          m = re.search(r'const YTD = (.*?);', s, re.S)
          ytd = json.JSONDecoder().raw_decode(m.group(1))[0]
          p = re.search(r'const PERIODS = (.*?);', s, re.S)
          periods = json.JSONDecoder().raw_decode(p.group(1))[0]
          ytd_payload = periods.get('ytd', {})
          mavic = next((x for x in ytd_payload.get('factories', []) if x.get('name') == 'Mavic Sports'), {})
          print('YTD_RECONCILIATION total_qty=%s total_orders=%s' % (ytd.get('volume'), ytd.get('orders')))
          print('MAVIC_YTD_RECONCILIATION total_qty=%s qarma_checked=%s qarma_defects=%s coverage=%s' % (mavic.get('volume'), (mavic.get('qarma') or {}).get('sample_qty'), (mavic.get('qarma') or {}).get('defects'), (mavic.get('qarma') or {}).get('rate')))
          PY
          echo "Report: $(wc -c < report.html) bytes"

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --yes --now -a custimoo-defect-report-lars --remote-only
