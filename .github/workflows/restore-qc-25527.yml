name: Restore QC Screenshot Values
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - run: pip install azure-storage-blob requests
      - env:
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          from azure.storage.blob import BlobServiceClient, ContentSettings
          u='https://custimoolivedata.z13.web.core.windows.net/qc-rejections-data.json'
          d=json.load(urllib.request.urlopen(u,timeout=30)); d=d if isinstance(d,list) else [dict(v,order=k) for k,v in d.items()]
          found=False
          for r in d:
              if str(r.get('order','')).replace('#','')=='25527':
                  r['error_type']='BOTH'
                  r['avoidance_action']='Factory must check all the panels at cut part inspection, CUSTIMOO need to check patterns before proceeding to factory.'
                  r['work_comment']='Panel shade variation and logo miss on two pcs it was factory error, regarding strips it is pattern issue from CUSTIMOO side.'
                  found=True
          if not found: raise SystemExit('order 25527 not found')
          s=BlobServiceClient(account_url='https://custimoolivedata.blob.core.windows.net',credential=os.environ['KEY'].strip())
          b=s.get_blob_client('$web','qc-rejections-data.json')
          b.upload_blob(json.dumps(d),overwrite=True,content_settings=ContentSettings(content_type='application/json'))
          print('restored_order_25527: True')
          PY
