name: Restore Remake Annotation Blob
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - run: pip install azure-storage-blob
      - env:
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          from azure.storage.blob import BlobServiceClient, ContentSettings
          s=BlobServiceClient(account_url='https://custimoolivedata.blob.core.windows.net',credential=os.environ['KEY'].strip())
          b=s.get_blob_client(container='$web',blob='remake-mgmt-data.json')
          b.upload_blob(json.dumps([]),overwrite=True,content_settings=ContentSettings(content_type='application/json'))
          print('restored_empty_annotation_blob: True')
          PY
