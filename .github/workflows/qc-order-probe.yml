name: QC Order Probe
on:
  workflow_dispatch:
    inputs:
      order:
        description: Order number
        required: true
        default: '26354'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Qarma order
        env:
          QARMA_INSPECTIONS_URL: ${{ secrets.QARMA_INSPECTIONS_URL }}
          ORDER: ${{ inputs.order }}
        run: |
          python3 - <<'PY'
          import csv, gzip, io, json, os, urllib.request
          req=urllib.request.Request(os.environ['QARMA_INSPECTIONS_URL'], headers={'Accept':'text/csv,application/gzip,*/*'})
          raw=urllib.request.urlopen(req, timeout=60).read()
          with gzip.GzipFile(fileobj=io.BytesIO(raw)) as gz:
              rows=csv.DictReader(io.TextIOWrapper(gz, encoding='utf-8-sig', newline=''))
              keys=('Order number','Conclusion','Status','Inspection type','Reinspection of','Report inspection id','Inspection id','Original total quantity','Actual sample quantity','Minor defects pieces affected','Major defects pieces affected','Critical defects pieces affected','Inspection end time','Scheduled inspection date')
              found=[{k:r.get(k,'') for k in keys} for r in rows if str(r.get('Order number','')).strip()==os.environ['ORDER']]
          print(json.dumps(found, indent=2))
          PY
