name: Debug Remake Qarma Split
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openssh-client
          pip install psycopg2-binary azure-storage-blob requests openpyxl
      - name: Set up SSH tunnel
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.TUNNEL_HOST }}
          PORT: ${{ secrets.TUNNEL_PORT }}
          USER: ${{ secrets.TUNNEL_USER }}
          RDS: ${{ secrets.RDS_HOST }}
        run: |
          mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/id_rsa; chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh -f -N -L 5433:${RDS}:5432 -p "$PORT" "$USER@$HOST" -o StrictHostKeyChecking=yes -o ServerAliveInterval=60 -o ExitOnForwardFailure=yes
      - name: Generate and inspect
        env:
          CUSTIMOO_DB_HOST: 127.0.0.1
          CUSTIMOO_DB_PORT: 5433
          CUSTIMOO_DB_NAME: custimoo-prod
          CUSTIMOO_DB_USER: lakr@custimoo.com
          CUSTIMOO_DB_SSLMODE: require
          CUSTIMOO_DB_PASSWORD: ${{ secrets.CUSTIMOO_DB_PASSWORD }}
          CUSTIMOO_GRAPH_TENANT_ID: ${{ secrets.CUSTIMOO_GRAPH_TENANT_ID }}
          CUSTIMOO_GRAPH_CLIENT_ID: ${{ secrets.CUSTIMOO_GRAPH_CLIENT_ID }}
          CUSTIMOO_GRAPH_CLIENT_SECRET: ${{ secrets.CUSTIMOO_GRAPH_CLIENT_SECRET }}
          AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
          QARMA_INSPECTIONS_URL: ${{ secrets.QARMA_INSPECTIONS_URL }}
        run: |
          python3 scripts/html_report.py >/tmp/gen.log 2>&1
          python3 - <<'PY'
          import json,re
          s=open('report.html').read(); m=re.search(r'const DATA = (.*?);\nconst HUMMEL_DATA',s,re.S); d=json.loads(m.group(1))
          for f in d.get('factories',[]): print(f['name'],f.get('remake_orders'),f.get('remake_orders_checked_by_qarma'),f.get('remake_orders_not_checked_by_qarma'))
          PY
