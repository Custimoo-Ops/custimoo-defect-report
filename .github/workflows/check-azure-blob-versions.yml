name: Check Azure Blob Versions
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: pip install azure-storage-blob
      - env:
          KEY: ${{ secrets.AZURE_STORAGE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from azure.storage.blob import BlobServiceClient
          s=BlobServiceClient(account_url='https://custimoolivedata.blob.core.windows.net',credential=os.environ['KEY'].strip())
          c=s.get_container_client('$web')
          for b in c.list_blobs(name_starts_with='remake-mgmt-data.json', include=['versions']):
              print('name=',b.name,'version=',getattr(b,'version_id',None),'size=',b.size,'last_modified=',b.last_modified)
          PY
