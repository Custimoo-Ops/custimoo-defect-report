# fly.toml app configuration file for custimoo-failure-report
app = 'custimoo-defect-report-lars'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "todo_data"
  destination = "/data"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[env]
  CUSTIMOO_DB_HOST = "127.0.0.1"
  CUSTIMOO_DB_PORT = "5433"
  CUSTIMOO_DB_NAME = "custimoo-prod"
  CUSTIMOO_DB_USER = "lakr@custimoo.com"
  CUSTIMOO_DB_SSLMODE = "require"
  TUNNEL_HOST = "52.1.115.94"
  TUNNEL_PORT = "22"
  TUNNEL_USER = "sshtunnel_db"
  RDS_HOST = "custimoo-prod.cluster-ro-cbmocqcg23hg.us-east-1.rds.amazonaws.com"
  REGENERATE_CRON = "0 * * * *"
